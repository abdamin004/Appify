services:
  mongodb:
    image: mongo:7.0
    container_name: university_events_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: university_events
    volumes:
      - mongo-data:/data/db
    networks:
      - university-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_events_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules  # Keeps container's node_modules intact (good for perf)
    networks:
      - university-network
    environment:
      - PORT=${PORT:-5001}
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:admin123@mongodb:27017/university_events?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university_events_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Same as backend
    networks:
      - university-network
    stdin_open: true
    tty: true
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5001/api}

volumes:
  mongo-data:

networks:
  university-network:
    driver: bridge